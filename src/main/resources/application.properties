# Spring Boot Configuration

# PostgreSQL Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres-db:5432/matchenginedb_dev}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=NDUzYjQxZTYtM2I3My00YjA5LTkwMjItMDIxMzI0M2FjMDU2Cg==
jwt.expiration=${JWT_EXPIRATION:86400}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Initial Admin User Configuration
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:password}
admin.email=${ADMIN_EMAIL:admin@example.com}